
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: health-steward-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-health_steward}
      POSTGRES_USER: ${POSTGRES_USER:-health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-health}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health-steward-backend
    env_file: backend/.env
    environment:
      # Docker Desktop / bind mount 下 watchfiles 的文件事件监听不可靠,
      # 会导致 uvicorn --reload 检测不到代码变化(reload 后仍跑旧代码,
      # 流式 SSE 缺失 [DONE] 使前端卡在"持续输出"). 强制轮询以根治.
      WATCHFILES_FORCE_POLLING: "true"
      USERDATA_DIR: "/app/userdata"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # User health data: bind-mounted to host so files are visible & persistent.
      # Host path configurable via env (default ./userdata).
      - ${USERDATA_HOST_DIR:-./userdata}:/app/userdata
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: health-steward-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
